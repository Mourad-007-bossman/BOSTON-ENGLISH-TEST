<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boston English Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{sans:['Plus Jakarta Sans','ui-sans-serif','system-ui']}}}};
(function(){let d=false;try{if(window.parent&&window.parent!==window)d=window.parent.document.documentElement.classList.contains('dark');}catch(e){}
if(!d){const s=localStorage.getItem('theme-preference');const p=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;d=s?s==='dark':p;}
document.documentElement.classList.toggle('dark',d);})();
window.setTheme=function(t){const d=t==='dark';document.documentElement.classList.toggle('dark',d);localStorage.setItem('theme-preference',d?'dark':'light');};
window.addEventListener('message',function(event){if(event.data&&event.data.type==='BEC_THEME_CHANGE'){window.setTheme(event.data.theme==='dark'?'dark':'light');}});
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body class="h-full overflow-x-hidden font-sans">
<div class="isolate relative min-h-[100dvh] overflow-x-hidden bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-50">
<div class="pointer-events-none fixed inset-0 z-0">
<div class="absolute -top-28 -left-28 h-80 w-80 rounded-full bg-indigo-500/15 blur-3xl dark:bg-indigo-500/25"></div>
<div class="absolute -bottom-36 -right-28 h-96 w-96 rounded-full bg-blue-500/10 blur-3xl dark:bg-blue-500/20"></div>
<div class="absolute left-1/2 top-[85%] -translate-x-1/2 h-[28rem] w-[28rem] rounded-full bg-emerald-500/10 blur-3xl dark:bg-emerald-500/15"></div>
</div>
<div class="relative z-10 mx-auto flex min-h-[100dvh] w-full flex-col justify-center gap-8 px-6 py-10" style="max-width:1150px">
<div data-in class="text-center">
<span class="inline-flex items-center whitespace-nowrap rounded-full border border-indigo-100 bg-indigo-50 px-4 py-1.5 text-[11px] font-black uppercase tracking-[0.3em] text-indigo-500 dark:border-indigo-800/50 dark:bg-indigo-900/30 dark:text-indigo-400">Practice 1 — Warm-Up Revision</span>
<h1 class="mt-5 text-3xl font-black tracking-tight sm:text-4xl md:text-5xl">Neighbour Complaints</h1>
<p class="mx-auto mt-4 max-w-[720px] text-base font-medium text-slate-600 md:text-lg dark:text-slate-300">Match the complaints with the responses. Click a response, then click the complaint it answers.</p>
</div>
<div data-in id="m"></div>
</div>
</div>
<script>
function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.9;speechSynthesis.speak(u);}catch(e){}}
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function initSort(cfg){
  const m=document.getElementById(cfg.mount);let sel=null,done=0;
  const total=cfg.groups.reduce((n,g)=>n+g.items.length,0);
  const bar=el('div','mb-6 flex flex-wrap items-center justify-between gap-3');
  const prog=el('span','rounded-full border border-slate-200 bg-white px-4 py-1.5 text-xs font-black uppercase tracking-widest text-slate-500 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-300');
  const btns=el('div','flex gap-3');
  const bReset=el('button','rounded-xl bg-indigo-600 px-4 py-2 text-xs font-bold text-white hover:bg-indigo-500','Reset');
  btns.append(bReset);bar.append(prog,btns);
  const grid=el('div','grid gap-4 '+(cfg.cols||'md:grid-cols-2'));
  const pool=el('div','mb-6 flex flex-wrap justify-center gap-3 rounded-3xl border-2 border-dashed border-slate-300 p-5 dark:border-slate-600');
  m.append(bar,pool,grid);
  const slots=[];
  function chipStyle(c,g){c.style.background=COLORS[g%COLORS.length];c.style.color='#fff';}
  function place(c,g){chipStyle(c,g);c.classList.remove('ring-4','ring-indigo-300');c.dataset.placed=1;slots[g].append(c);done++;upd();}
  function upd(){prog.textContent=done+' / '+total+(done===total?' — Well done!':'');}
  function build(){
    grid.innerHTML='';pool.innerHTML='';slots.length=0;done=0;sel=null;
    cfg.groups.forEach((g,gi)=>{
      const card=el('div','rounded-3xl border-2 bg-white p-4 shadow-sm transition dark:bg-slate-800 cursor-pointer');
      card.style.borderColor=COLORS[gi%COLORS.length]+'66';
      const h=el('div','mb-3 text-base font-extrabold md:text-lg',g.title);h.style.color=COLORS[gi%COLORS.length];
      const s=el('div','flex min-h-[3.5rem] flex-wrap gap-2');slots.push(s);card.append(h,s);grid.append(card);
      card.onclick=()=>{if(!sel)return;
        if(+sel.dataset.g===gi){place(sel,gi);sel=null;}
        else{const c=sel;c.animate([{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'translateX(0)'}],{duration:250,iterations:2});card.animate([{background:'#fecaca'},{background:''}],{duration:500});}};
    });
    const all=[];cfg.groups.forEach((g,gi)=>g.items.forEach(t=>all.push({t,gi})));
    shuffle(all).forEach(o=>{const c=el('button','rounded-xl border border-slate-300 bg-slate-100 px-4 py-2.5 text-left text-sm font-semibold text-slate-800 transition hover:-translate-y-0.5 dark:border-slate-600 dark:bg-slate-700 dark:text-slate-100',o.t);c.dataset.g=o.gi;
      c.onclick=e=>{e.stopPropagation();if(c.dataset.placed)return;if(sel)sel.classList.remove('ring-4','ring-indigo-300');sel=c;c.classList.add('ring-4','ring-indigo-300');speak(o.t);};
      pool.append(c);});
    upd();
  }
  bReset.onclick=build;
  build();
}
function initQuiz(cfg){
  const m=document.getElementById(cfg.mount);let score=0,answered=0;
  const sc=el('div','mb-5 inline-block rounded-full border border-slate-200 bg-white px-4 py-1.5 text-xs font-black uppercase tracking-widest text-slate-500 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-300');
  const upd=()=>sc.textContent='First-try score: '+score+' / '+cfg.qs.length;upd();
  const list=el('div','grid gap-4 '+(cfg.cols||'md:grid-cols-2'));m.append(sc,list);
  cfg.qs.forEach((q,qi)=>{
    const card=el('div','rounded-3xl border border-slate-200 bg-white p-5 shadow-sm dark:border-slate-700 dark:bg-slate-800');
    const h=el('div','mb-4 flex gap-3 text-base font-bold leading-snug');
    const n=el('span','flex h-7 w-7 shrink-0 items-center justify-center rounded-lg bg-indigo-600 text-xs font-black text-white',qi+1);h.append(n,el('span','',q.q));card.append(h);
    let tried=false,solved=false;
    const ok=(b)=>{solved=true;if(!tried)score++;upd();};
    if(q.type==='gap'){
      const row=el('div','flex gap-2');const inp=el('input','min-w-0 flex-1 rounded-xl border border-slate-300 bg-slate-50 px-4 py-2.5 text-sm font-semibold dark:border-slate-600 dark:bg-slate-900');inp.placeholder='Type your answer';
      const b=el('button','rounded-xl bg-indigo-600 px-5 py-2.5 text-sm font-bold text-white','Check');
      const chk=()=>{if(solved)return;if(inp.value.trim().toLowerCase()===q.answer.toLowerCase()){inp.className+=' !border-emerald-500 !bg-emerald-50 dark:!bg-emerald-900/40';ok();}else{tried=true;inp.animate([{transform:'translateX(-5px)'},{transform:'translateX(5px)'},{transform:'none'}],{duration:250});inp.classList.add('!border-rose-500');}};
      b.onclick=chk;inp.onkeydown=e=>{if(e.key==='Enter')chk();};row.append(inp,b);card.append(row);
    }else{
      const box=el('div','grid gap-2');
      q.options.forEach(o=>{const b=el('button','rounded-xl border border-slate-300 bg-slate-50 px-4 py-2.5 text-left text-sm font-semibold transition hover:border-indigo-400 dark:border-slate-600 dark:bg-slate-900',o);
        b.onclick=()=>{if(solved)return;if(o===q.answer){b.className='rounded-xl border border-emerald-500 bg-emerald-100 px-4 py-2.5 text-left text-sm font-bold text-emerald-900 dark:bg-emerald-900/50 dark:text-emerald-100';ok();}else{tried=true;b.className='rounded-xl border border-rose-400 bg-rose-100 px-4 py-2.5 text-left text-sm font-semibold text-rose-900 line-through dark:bg-rose-900/40 dark:text-rose-100';}};
        box.append(b);});card.append(box);
    }
    list.append(card);
  });
}
function initRoleplay(){
  const lines=[...document.querySelectorAll('[data-role]')];
  document.querySelectorAll('[data-hide]').forEach(b=>b.onclick=()=>{const r=b.dataset.hide;
    document.querySelectorAll('[data-hide]').forEach(x=>x.classList.remove('!bg-indigo-600','!text-white'));
    if(r!=='none')b.classList.add('!bg-indigo-600','!text-white');
    lines.forEach(l=>{const h=l.dataset.role===r;l.style.filter=h?'blur(7px)':'none';l.style.opacity=h?.6:1;});});
  lines.forEach(l=>l.addEventListener('click',()=>{l.style.filter='none';l.style.opacity=1;speak(l.dataset.say||l.textContent);}));
}
function playIn(){
  const items=document.querySelectorAll('[data-in]');
  if(!window.gsap)return;
  const tl=gsap.timeline();
  tl.fromTo(items,{opacity:0,y:22},{opacity:1,y:0,duration:.6,stagger:.09,ease:'power3.out',clearProps:'transform'});
  window.resetSlide=()=>{tl.restart();};
}
const COLORS=["#4f46e5","#059669","#d97706","#dc2626","#0284c7","#9333ea","#ea580c"];
document.addEventListener('DOMContentLoaded',()=>{playIn();initSort({mount:'m',cols:'md:grid-cols-2',groups:[{"title":"Tenant: Hi, excuse me. Your music is very loud at night. Could you turn it down?","items":["Neighbour: Sorry! I’m having a small party tonight, but I’ll lower the music."]},{"title":"Tenant: Your dog keeps barking very early in the morning. I can’t sleep well.","items":["Neighbour: I’m sorry about that. I’ll try to keep the dog inside at night."]},{"title":"Tenant: There is a bad smell coming from your apartment sometimes.","items":["Neighbour: Oh, I didn’t realize that. I’ll check the problem."]},{"title":"Tenant: Could you please stop parking in front of my garage?","items":["Neighbour: I’m really sorry. I’ll park somewhere else from now on."]},{"title":"Tenant: The washing machine is very loud every evening. Can you do the laundry earlier?","items":["Neighbour: Of course. That is a good idea. I will try to finish before 8 p.m."]}]});});
</script>
</body>
</html>
