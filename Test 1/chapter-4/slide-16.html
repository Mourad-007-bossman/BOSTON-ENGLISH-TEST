<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boston English Center</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Plus Jakarta Sans', 'ui-sans-serif', 'system-ui'] } } } };
        (function applyInitialTheme() {
            let useDark = false;
            try { if (window.parent && window.parent !== window) useDark = window.parent.document.documentElement.classList.contains('dark'); } catch (e) {}
            if (!useDark) {
                const saved = localStorage.getItem('theme-preference');
                const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                useDark = saved ? saved === 'dark' : prefersDark;
            }
            document.documentElement.classList.toggle('dark', useDark);
        })();
        window.setTheme = function setTheme(theme) {
            const useDark = theme === 'dark';
            document.documentElement.classList.toggle('dark', useDark);
            localStorage.setItem('theme-preference', useDark ? 'dark' : 'light');
        };
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body class="h-full overflow-x-hidden">
<div class="isolate relative min-h-[100dvh] overflow-x-hidden overflow-y-auto bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-50">
    <div class="pointer-events-none fixed inset-0 z-0">
        <div class="absolute -top-28 -left-28 h-80 w-80 rounded-full bg-indigo-500/15 blur-3xl dark:bg-indigo-500/25"></div>
        <div class="absolute -bottom-36 -right-28 h-96 w-96 rounded-full bg-emerald-500/10 blur-3xl dark:bg-emerald-500/20"></div>
    </div>

    <div class="relative z-10 mx-auto flex min-h-[100dvh] w-full max-w-[880px] flex-col gap-5 px-5 py-10">
        <div class="header-section -translate-y-5 text-center opacity-0">
            <span class="inline-flex items-center rounded-full border border-indigo-100 bg-indigo-50 px-4 py-1.5 text-[11px] font-black uppercase tracking-[0.3em] text-indigo-500 dark:border-indigo-800/50 dark:bg-indigo-900/30 dark:text-indigo-400">
                SLIDE 16 — WRITING
            </span>
            <h1 class="mt-4 mb-1 text-2xl font-black tracking-tight text-slate-900 sm:text-4xl dark:text-slate-100">A Complaint Email</h1>
        </div>

        <div class="prompt-card rounded-2xl border border-slate-200 bg-white p-5 opacity-0 shadow-sm dark:border-slate-700 dark:bg-slate-800">
            <p class="text-sm font-semibold leading-relaxed text-slate-700 dark:text-slate-200">
                You had a problem at a restaurant last weekend. Write a short complaint email to the restaurant manager.
            </p>
            <div class="mt-4 grid grid-cols-1 gap-2 sm:grid-cols-2">
                <div class="flex items-center gap-2 text-sm font-bold text-slate-600 dark:text-slate-300">
                    <svg class="h-4 w-4 shrink-0 text-indigo-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-7.4 7-12.5A7 7 0 1 0 5 8.5C5 13.6 12 21 12 21Z"/><circle cx="12" cy="8.5" r="2.5"/></svg>
                    Where you went
                </div>
                <div class="flex items-center gap-2 text-sm font-bold text-slate-600 dark:text-slate-300">
                    <svg class="h-4 w-4 shrink-0 text-indigo-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 2.6 17a1.7 1.7 0 0 0 1.5 2.6h15.8a1.7 1.7 0 0 0 1.5-2.6L13.7 3.9a1.7 1.7 0 0 0-3 0Z"/><path d="M12 9.5v4M12 17h.01"/></svg>
                    What the problem was
                </div>
                <div class="flex items-center gap-2 text-sm font-bold text-slate-600 dark:text-slate-300">
                    <svg class="h-4 w-4 shrink-0 text-indigo-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
                    What the waiter did
                </div>
                <div class="flex items-center gap-2 text-sm font-bold text-slate-600 dark:text-slate-300">
                    <svg class="h-4 w-4 shrink-0 text-indigo-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
                    What you want the restaurant to do
                </div>
            </div>
            <p class="mt-4 text-xs font-black uppercase tracking-widest text-indigo-500">Use 40–60 words</p>
        </div>

        <div class="chips-card opacity-0">
            <p class="mb-2 text-xs font-black uppercase tracking-widest text-slate-400">Tap an expression to add it</p>
            <div id="chips" class="flex flex-wrap gap-2"></div>
        </div>

        <div class="writing-card flex flex-1 flex-col rounded-2xl border border-slate-200 bg-white p-4 opacity-0 shadow-sm dark:border-slate-700 dark:bg-slate-800">
            <textarea id="essay" rows="7" placeholder="I visited your restaurant on…" class="w-full flex-1 resize-none rounded-xl border border-slate-200 bg-slate-50 p-4 text-sm font-semibold leading-relaxed text-slate-800 outline-none focus:border-indigo-400 dark:border-slate-600 dark:bg-slate-900/40 dark:text-slate-100"></textarea>
            <div class="mt-3 flex items-center justify-between">
                <span id="word-count" class="rounded-full bg-slate-100 px-3 py-1 text-xs font-black text-slate-500 dark:bg-slate-700 dark:text-slate-300">0 words</span>
                <button id="clear-btn" class="text-xs font-black text-slate-400 transition hover:text-rose-500">Clear</button>
            </div>
        </div>
    </div>
</div>

<script>
    const EXPRESSIONS = [
        'I visited your restaurant on…',
        'There was a problem with…',
        'The food was…',
        'The waiter…',
        'I would like…',
    ];

    const essay = document.getElementById('essay');
    const wordCount = document.getElementById('word-count');
    const chipsWrap = document.getElementById('chips');

    EXPRESSIONS.forEach(expr => {
        const chip = document.createElement('button');
        chip.className = 'rounded-full border border-emerald-200 bg-emerald-50 px-3.5 py-1.5 text-xs font-bold text-emerald-700 shadow-sm transition hover:bg-emerald-100 dark:border-emerald-800/50 dark:bg-emerald-900/20 dark:text-emerald-300';
        chip.textContent = expr;
        chip.addEventListener('click', () => {
            const sep = essay.value && !essay.value.endsWith('\n') && !essay.value.endsWith(' ') ? ' ' : '';
            essay.value = essay.value + sep + expr + ' ';
            essay.focus();
            updateCount();
        });
        chipsWrap.appendChild(chip);
    });

    function updateCount() {
        const words = essay.value.trim().split(/\s+/).filter(Boolean);
        const n = words.length;
        wordCount.textContent = `${n} word${n === 1 ? '' : 's'}`;
        wordCount.className = 'rounded-full px-3 py-1 text-xs font-black ' +
            (n === 0 ? 'bg-slate-100 text-slate-500 dark:bg-slate-700 dark:text-slate-300'
            : n < 40 ? 'bg-amber-100 text-amber-700 dark:bg-amber-900/30 dark:text-amber-300'
            : n <= 60 ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/30 dark:text-emerald-300'
            : 'bg-rose-100 text-rose-700 dark:bg-rose-900/30 dark:text-rose-300');
    }

    essay.addEventListener('input', updateCount);
    document.getElementById('clear-btn').addEventListener('click', () => { essay.value = ''; updateCount(); });

    function playIn() {
        updateCount();
        if (!window.gsap) {
            document.querySelectorAll('.header-section, .prompt-card, .chips-card, .writing-card').forEach(el => { el.style.opacity = '1'; el.style.transform = 'none'; });
            return;
        }
        const tl = gsap.timeline({ defaults: { ease: 'power4.out' } });
        tl.to('.header-section', { opacity: 1, y: 0, duration: 0.7 })
          .to('.prompt-card', { opacity: 1, duration: 0.5 }, '-=0.3')
          .to('.chips-card', { opacity: 1, duration: 0.4 }, '-=0.2')
          .to('.writing-card', { opacity: 1, duration: 0.5 }, '-=0.2');

        window.resetSlide = () => {
            tl.pause(0);
            gsap.set('.header-section, .prompt-card, .chips-card, .writing-card', { clearProps: 'all' });
            tl.restart();
        };
    }

    document.addEventListener('DOMContentLoaded', playIn);
</script>
</body>
</html>
