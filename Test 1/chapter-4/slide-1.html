<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boston English Center</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { fontFamily: { sans: ['Plus Jakarta Sans', 'ui-sans-serif', 'system-ui'] } } }
        };

        (function applyInitialTheme() {
            let useDark = false;
            try {
                if (window.parent && window.parent !== window) {
                    useDark = window.parent.document.documentElement.classList.contains('dark');
                }
            } catch (e) {}
            if (!useDark) {
                const saved = localStorage.getItem('theme-preference');
                const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                useDark = saved ? saved === 'dark' : prefersDark;
            }
            document.documentElement.classList.toggle('dark', useDark);
        })();

        window.setTheme = function setTheme(theme) {
            const useDark = theme === 'dark';
            document.documentElement.classList.toggle('dark', useDark);
            localStorage.setItem('theme-preference', useDark ? 'dark' : 'light');
        };
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body class="h-full overflow-x-hidden">
<div class="isolate relative min-h-[100dvh] overflow-x-hidden overflow-y-auto bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-50">
    <div class="pointer-events-none fixed inset-0 z-0">
        <div class="absolute -top-28 -left-28 h-80 w-80 rounded-full bg-indigo-500/15 blur-3xl dark:bg-indigo-500/25"></div>
        <div class="absolute -bottom-36 -right-28 h-96 w-96 rounded-full bg-rose-500/10 blur-3xl dark:bg-rose-500/20"></div>
        <div class="absolute left-1/2 top-[85%] -translate-x-1/2 h-[28rem] w-[28rem] rounded-full bg-amber-500/10 blur-3xl dark:bg-amber-500/15"></div>
    </div>

    <div class="relative z-10">
        <div class="mx-auto flex min-h-[100dvh] w-full max-w-[1200px] items-center px-6 py-10 lg:px-16 lg:py-16">
            <div class="slide-content grid w-full grid-cols-1 items-center gap-12 lg:grid-cols-[1.1fr_0.9fr] lg:gap-20">
                <div class="text-section z-10 text-center lg:text-left">
                    <div class="unit-badge mb-6 inline-flex items-center gap-2 rounded-full border border-indigo-100 bg-indigo-50 px-5 py-2 text-[0.72rem] font-extrabold uppercase tracking-[0.15em] text-indigo-600 opacity-0 transition-all duration-300 dark:border-indigo-500/30 dark:bg-indigo-500/15 dark:text-indigo-300">
                        <span>Unit 4 — Common Complaints</span>
                        <span class="h-1 w-1 rounded-full bg-indigo-400"></span>
                        <span>Lesson 2</span>
                    </div>

                    <h1 class="hero-title mb-6 text-4xl font-black leading-[1.05] tracking-[-0.04em] opacity-0 sm:text-5xl lg:text-[5rem]">
                        Restaurant <span class="bg-gradient-to-br from-rose-500 to-amber-500 bg-clip-text text-transparent">Complaints</span>
                    </h1>
                    <p class="hero-subtitle mb-10 max-w-[480px] text-base font-medium leading-[1.6] text-slate-600 opacity-0 sm:text-lg lg:text-xl lg:mx-0 mx-auto dark:text-slate-300">
                        Learn how to describe problems politely, make complaints in shops and restaurants, and help a customer feel heard — the English way.
                    </p>

                    <div class="skills-row mb-10 flex flex-wrap items-center justify-center gap-2.5 opacity-0 lg:justify-start">
                        <span class="inline-flex items-center gap-1.5 rounded-full border border-slate-200 bg-white px-3.5 py-1.5 text-xs font-bold text-slate-600 shadow-sm dark:border-slate-700 dark:bg-slate-800 dark:text-slate-300">
                            <svg class="h-3.5 w-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg>
                            Restaurant vocabulary
                        </span>
                        <span class="inline-flex items-center gap-1.5 rounded-full border border-slate-200 bg-white px-3.5 py-1.5 text-xs font-bold text-slate-600 shadow-sm dark:border-slate-700 dark:bg-slate-800 dark:text-slate-300">
                            <svg class="h-3.5 w-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="12" rx="2.5"/><path d="M9 16 7 20 12 16Z" fill="currentColor" stroke="none"/></svg>
                            Polite complaints
                        </span>
                        <span class="inline-flex items-center gap-1.5 rounded-full border border-slate-200 bg-white px-3.5 py-1.5 text-xs font-bold text-slate-600 shadow-sm dark:border-slate-700 dark:bg-slate-800 dark:text-slate-300">
                            <svg class="h-3.5 w-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M3.5 20c0-3.6 2.5-6.5 5.5-6.5s5.5 2.9 5.5 6.5"/><circle cx="17" cy="9" r="2.3"/><path d="M15.3 14.3c2.6.5 4.2 2.7 4.2 5.7"/></svg>
                            Role-play practice
                        </span>
                    </div>

                    <div class="flex items-center justify-center gap-6 opacity-0 lg:justify-start" id="cta-line">
                        <div class="h-px w-20 bg-indigo-200 dark:bg-indigo-800"></div>
                        <span class="text-xs font-black uppercase tracking-widest text-indigo-400 dark:text-indigo-500">Ready to Begin?</span>
                    </div>
                </div>

                <div class="image-section relative flex items-center justify-center lg:justify-start">
                    <button id="start-btn"
                            class="group relative mx-auto flex items-center gap-4 rounded-[1.2rem] bg-slate-900 px-6 py-4 text-lg font-black text-white shadow-2xl transition-all hover:scale-105 active:scale-95 sm:rounded-[2rem] sm:px-12 sm:py-6 sm:text-2xl lg:mx-0 dark:bg-white dark:text-slate-900 dark:shadow-indigo-500/30">
                        <span>Start Lesson</span>
                        <span class="flex h-7 w-7 items-center justify-center rounded-full bg-rose-500 text-white transition-transform group-hover:rotate-12 sm:h-10 sm:w-10">
                            <svg class="h-3.5 w-3.5 sm:h-5 sm:w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg>
                        </span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const startBtn = document.getElementById('start-btn');
        const revealEls = document.querySelectorAll('.unit-badge, .hero-title, .hero-subtitle, .skills-row, #cta-line, .image-section');

        function goToNextSlide() {
            try {
                if (window.parent && typeof window.parent.nextSlide === 'function') {
                    window.parent.nextSlide();
                    return;
                }
            } catch (e) {}
            try {
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage({ type: 'BEC_NAV', action: 'next' }, '*');
                    return;
                }
            } catch (e) {}
            window.location.href = 'slide-2.html';
        }

        function playIn() {
            if (!window.gsap) {
                revealEls.forEach((el) => { el.style.opacity = '1'; el.style.transform = 'none'; });
                return;
            }
            const tl = gsap.timeline();
            tl.to('.unit-badge', { opacity: 1, y: -10, duration: 0.5, ease: 'back.out(1.7)' });
            tl.to('.hero-title', { opacity: 1, y: -15, duration: 0.6, ease: 'power4.out' }, '-=0.35');
            tl.to('.hero-subtitle', { opacity: 1, y: -10, duration: 0.5, ease: 'power3.out' }, '-=0.35');
            tl.to('.skills-row', { opacity: 1, y: -8, duration: 0.5, ease: 'power3.out' }, '-=0.25');
            tl.to('#cta-line', { opacity: 1, duration: 0.6 }, '-=0.2');

            window.resetSlide = () => {
                tl.pause(0);
                gsap.set('.hero-title, .hero-subtitle, .unit-badge, .skills-row, #cta-line, .image-section', { clearProps: 'all' });
                tl.restart();
            };
        }

        playIn();

        let isNavigating = false;
        if (startBtn) {
            startBtn.addEventListener('click', () => {
                if (isNavigating) return;
                isNavigating = true;
                if (!window.gsap) { goToNextSlide(); return; }
                gsap.fromTo(startBtn, { scale: 1 }, { scale: 0.96, duration: 0.10, yoyo: true, repeat: 1 });
                goToNextSlide();
            });
        }
    });
</script>
</body>
</html>
