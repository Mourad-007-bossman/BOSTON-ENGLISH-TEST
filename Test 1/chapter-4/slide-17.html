<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boston English Center</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Plus Jakarta Sans', 'ui-sans-serif', 'system-ui'] } } } };
        (function applyInitialTheme() {
            let useDark = false;
            try { if (window.parent && window.parent !== window) useDark = window.parent.document.documentElement.classList.contains('dark'); } catch (e) {}
            if (!useDark) {
                const saved = localStorage.getItem('theme-preference');
                const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                useDark = saved ? saved === 'dark' : prefersDark;
            }
            document.documentElement.classList.toggle('dark', useDark);
        })();
        window.setTheme = function setTheme(theme) {
            const useDark = theme === 'dark';
            document.documentElement.classList.toggle('dark', useDark);
            localStorage.setItem('theme-preference', useDark ? 'dark' : 'light');
        };
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body class="h-full overflow-x-hidden">
<div class="isolate relative min-h-[100dvh] overflow-x-hidden overflow-y-auto bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-50">
    <div class="pointer-events-none fixed inset-0 z-0">
        <div class="absolute -top-28 -left-28 h-80 w-80 rounded-full bg-indigo-500/15 blur-3xl dark:bg-indigo-500/25"></div>
        <div class="absolute -bottom-36 -right-28 h-96 w-96 rounded-full bg-amber-500/10 blur-3xl dark:bg-amber-500/20"></div>
    </div>

    <div class="relative z-10 mx-auto flex min-h-[100dvh] w-full max-w-[760px] flex-col items-center justify-center gap-7 px-6 py-12 text-center">
        <div class="header-section -translate-y-5 opacity-0">
            <span class="inline-flex items-center rounded-full border border-indigo-100 bg-indigo-50 px-4 py-1.5 text-[11px] font-black uppercase tracking-[0.3em] text-indigo-500 dark:border-indigo-800/50 dark:bg-indigo-900/30 dark:text-indigo-400">
                SLIDE 17 — WRAP-UP
            </span>
            <h1 class="mt-5 mb-2 text-3xl font-black tracking-tight text-slate-900 sm:text-5xl dark:text-slate-100">Nicely Done!</h1>
            <p class="text-sm font-semibold text-slate-500 sm:text-base dark:text-slate-400">What is a new word or expression you learnt today?</p>
        </div>

        <div class="reflect-card w-full max-w-md opacity-0">
            <input id="reflect-input" type="text" placeholder="Type a word or phrase…" class="w-full rounded-2xl border border-slate-200 bg-white px-5 py-3.5 text-center text-sm font-bold text-slate-800 shadow-sm outline-none focus:border-indigo-400 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-100">
            <p id="reflect-echo" class="mt-3 hidden justify-center gap-1.5 text-sm font-black text-emerald-600 dark:text-emerald-400"></p>
        </div>

        <div class="recap-card w-full opacity-0">
            <p class="mb-3 text-xs font-black uppercase tracking-widest text-slate-400">Today's Key Vocabulary</p>
            <div class="flex flex-wrap items-center justify-center gap-2">
                <span class="rounded-full bg-white px-3 py-1.5 text-xs font-bold text-slate-600 shadow-sm dark:bg-slate-800 dark:text-slate-300">undercooked</span>
                <span class="rounded-full bg-white px-3 py-1.5 text-xs font-bold text-slate-600 shadow-sm dark:bg-slate-800 dark:text-slate-300">apologize</span>
                <span class="rounded-full bg-white px-3 py-1.5 text-xs font-bold text-slate-600 shadow-sm dark:bg-slate-800 dark:text-slate-300">patience</span>
                <span class="rounded-full bg-white px-3 py-1.5 text-xs font-bold text-slate-600 shadow-sm dark:bg-slate-800 dark:text-slate-300">bill</span>
                <span class="rounded-full bg-white px-3 py-1.5 text-xs font-bold text-slate-600 shadow-sm dark:bg-slate-800 dark:text-slate-300">appreciate</span>
                <span class="rounded-full bg-white px-3 py-1.5 text-xs font-bold text-slate-600 shadow-sm dark:bg-slate-800 dark:text-slate-300">right away</span>
                <span class="rounded-full bg-white px-3 py-1.5 text-xs font-bold text-slate-600 shadow-sm dark:bg-slate-800 dark:text-slate-300">certainly</span>
            </div>
        </div>

        <div class="thanks-line flex items-center gap-4 opacity-0">
            <div class="h-px w-16 bg-indigo-200 dark:bg-indigo-800"></div>
            <span class="inline-flex items-center gap-2 text-2xl font-black text-indigo-500">
                Thanks!
                <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg>
            </span>
            <div class="h-px w-16 bg-indigo-200 dark:bg-indigo-800"></div>
        </div>

        <button id="restart-btn" class="restart-btn inline-flex items-center gap-1.5 rounded-2xl border border-slate-200 bg-white px-6 py-3 text-sm font-black text-slate-500 opacity-0 shadow-sm transition hover:text-indigo-600 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-300">
            <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 9.3h5v-5M3 19.6v-5h5"/><path d="M3 10a8 8 0 0 1 13.8-5.5L21 9M3 14.9l4.2 4.5A8 8 0 0 0 21 14"/></svg>
            Restart Lesson
        </button>
    </div>
</div>

<script>
    const input = document.getElementById('reflect-input');
    const echo = document.getElementById('reflect-echo');

    input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && input.value.trim()) {
            const sparkle = '<svg class="h-4 w-4 shrink-0 text-amber-400" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.6 5.9 6.4.6-4.8 4.3 1.4 6.3L12 16.9l-5.6 3.3 1.4-6.3-4.8-4.3 6.4-.6L12 2.5Z"/></svg>';
            echo.innerHTML = `Great — "${input.value.trim()}" is a keeper! ${sparkle}`;
            echo.classList.remove('hidden');
            echo.classList.add('flex');
            if (window.gsap) gsap.fromTo(echo, { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.4 });
        }
    });

    document.getElementById('restart-btn').addEventListener('click', () => {
        try {
            if (window.parent && typeof window.parent.goToSlide === 'function') {
                window.parent.goToSlide(0);
            }
        } catch (e) {}
    });

    function playIn() {
        input.value = '';
        echo.classList.add('hidden');
        echo.classList.remove('flex');
        if (!window.gsap) {
            document.querySelectorAll('.header-section, .reflect-card, .recap-card, .thanks-line, .restart-btn').forEach(el => { el.style.opacity = '1'; el.style.transform = 'none'; });
            return;
        }
        const tl = gsap.timeline({ defaults: { ease: 'power4.out' } });
        tl.to('.header-section', { opacity: 1, y: 0, duration: 0.7 })
          .to('.reflect-card', { opacity: 1, duration: 0.5 }, '-=0.3')
          .to('.recap-card', { opacity: 1, duration: 0.5 }, '-=0.2')
          .to('.thanks-line', { opacity: 1, duration: 0.6, ease: 'back.out(1.7)' }, '-=0.1')
          .to('.restart-btn', { opacity: 1, duration: 0.4 }, '-=0.2');

        window.resetSlide = () => {
            tl.pause(0);
            gsap.set('.header-section, .reflect-card, .recap-card, .thanks-line, .restart-btn', { clearProps: 'all' });
            input.value = '';
            echo.classList.add('hidden');
            echo.classList.remove('flex');
            tl.restart();
        };
    }

    document.addEventListener('DOMContentLoaded', playIn);
</script>
</body>
</html>
