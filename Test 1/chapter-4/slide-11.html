<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boston English Center</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Plus Jakarta Sans', 'ui-sans-serif', 'system-ui'] } } } };
        (function applyInitialTheme() {
            let useDark = false;
            try { if (window.parent && window.parent !== window) useDark = window.parent.document.documentElement.classList.contains('dark'); } catch (e) {}
            if (!useDark) {
                const saved = localStorage.getItem('theme-preference');
                const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                useDark = saved ? saved === 'dark' : prefersDark;
            }
            document.documentElement.classList.toggle('dark', useDark);
        })();
        window.setTheme = function setTheme(theme) {
            const useDark = theme === 'dark';
            document.documentElement.classList.toggle('dark', useDark);
            localStorage.setItem('theme-preference', useDark ? 'dark' : 'light');
        };
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        .flip-scene { perspective: 1200px; }
        .flip-inner { position: relative; width: 100%; height: 100%; transition: transform .5s cubic-bezier(.4,.2,.2,1); transform-style: preserve-3d; }
        .flip-card.flipped .flip-inner { transform: rotateY(180deg); }
        .flip-face { position: absolute; inset: 0; backface-visibility: hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; overflow: hidden; border-radius: 1.25rem; padding: 1rem; text-align:center; }
        .flip-back { transform: rotateY(180deg); }
    </style>
</head>
<body class="h-full overflow-x-hidden">
<div class="isolate relative min-h-[100dvh] overflow-x-hidden overflow-y-auto bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-50">
    <div class="pointer-events-none fixed inset-0 z-0">
        <div class="absolute -top-28 -left-28 h-80 w-80 rounded-full bg-indigo-500/15 blur-3xl dark:bg-indigo-500/25"></div>
        <div class="absolute -bottom-36 -right-28 h-96 w-96 rounded-full bg-red-500/10 blur-3xl dark:bg-red-500/20"></div>
    </div>

    <div class="relative z-10 mx-auto flex min-h-[100dvh] w-full max-w-[1100px] flex-col items-center gap-6 px-5 py-10">
        <div class="header-section -translate-y-5 text-center opacity-0">
            <span class="inline-flex items-center rounded-full border border-indigo-100 bg-indigo-50 px-4 py-1.5 text-[11px] font-black uppercase tracking-[0.3em] text-indigo-500 dark:border-indigo-800/50 dark:bg-indigo-900/30 dark:text-indigo-400">
                SLIDE 11 — NEW VOCABULARY 2
            </span>
            <h1 class="mt-5 mb-1 text-2xl font-black tracking-tight text-slate-900 sm:text-4xl dark:text-slate-100">Tap a Card to Reveal the Meaning</h1>
        </div>

        <div id="grid" class="grid w-full grid-cols-2 gap-3 opacity-0 sm:grid-cols-3 lg:grid-cols-5"></div>
    </div>
</div>

<script>
    const WORDS = [
        { word: 'medium', meaning: 'cooked in the middle (not rare or well done)', color: '#dc2626' },
        { word: 'rare', meaning: 'meat that is cooked very lightly', color: '#f97316' },
        { word: 'apologize', meaning: 'to say sorry', color: '#6366f1' },
        { word: 'appreciate', meaning: 'to be thankful for something', color: '#10b981' },
        { word: 'kitchen', meaning: 'the place where food is prepared', color: '#0ea5e9' },
        { word: 'fresh fries', meaning: 'newly cooked potato fries', color: '#eab308' },
        { word: 'certainly', meaning: 'of course / definitely', color: '#8b5cf6' },
        { word: 'sorted', meaning: 'fixed or arranged correctly', color: '#ec4899' },
        { word: 'right away', meaning: 'immediately', color: '#06b6d4' },
        { word: 'as quickly as possible', meaning: 'very fast', color: '#84cc16' },
    ];

    const grid = document.getElementById('grid');
    WORDS.forEach((w) => {
        const card = document.createElement('div');
        card.className = 'flip-card flip-scene h-[116px] cursor-pointer sm:h-[128px]';
        const meaningSize = w.meaning.length > 50 ? 'text-[0.56rem] sm:text-[0.66rem]'
            : w.meaning.length > 30 ? 'text-[0.66rem] sm:text-[0.76rem]'
            : 'text-[0.78rem] sm:text-sm';
        const wordSize = w.word.length > 16 ? 'text-xs sm:text-sm' : 'text-sm sm:text-base';
        card.innerHTML = `
            <div class="flip-inner">
                <div class="flip-face flip-front text-white shadow-md" style="background:${w.color}">
                    <p class="${wordSize} font-black capitalize leading-tight">${w.word}</p>
                    <span class="mt-2 text-[10px] font-bold uppercase tracking-widest text-white/70">Tap to flip</span>
                </div>
                <div class="flip-face flip-back !p-2.5 border-2 bg-white shadow-md dark:bg-slate-800" style="border-color:${w.color}">
                    <p class="${meaningSize} font-bold leading-snug text-slate-700 dark:text-slate-200">${w.meaning}</p>
                </div>
            </div>`;
        card.addEventListener('click', () => card.classList.toggle('flipped'));
        grid.appendChild(card);
    });

    function playIn() {
        if (!window.gsap) {
            document.querySelectorAll('.header-section, #grid').forEach(el => { el.style.opacity = '1'; el.style.transform = 'none'; });
            return;
        }
        const tl = gsap.timeline({ defaults: { ease: 'power4.out' } });
        tl.to('.header-section', { opacity: 1, y: 0, duration: 0.7 })
          .to('#grid', { opacity: 1, duration: 0.5 }, '-=0.3')
          .from('.flip-card', { opacity: 0, y: 14, duration: 0.4, stagger: 0.06, clearProps: 'all' }, '-=0.3');

        window.resetSlide = () => {
            tl.pause(0);
            document.querySelectorAll('.flip-card').forEach(c => c.classList.remove('flipped'));
            gsap.set('.header-section, #grid, .flip-card', { clearProps: 'all' });
            tl.restart();
        };
    }

    document.addEventListener('DOMContentLoaded', playIn);
</script>
</body>
</html>
